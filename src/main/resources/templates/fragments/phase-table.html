<!--/*
  File separato apposta, sullo stesso schema di fragments/update.html: qui vivono i
  due fragment della tabella di fase, "phaseTable" (l'intero pannello, che ogni
  richiesta di pagina sostituisce per intero) e "phaseRowsBody" (le sole righe, usato
  da phaseTable per non duplicare il markup del corpo).

  Risponde a una domanda diversa dal pannello TARGET: qui "chi c'è ancora in questo
  ruolo, nell'ordine in cui verrà chiamato" (ordinato per quotazione Fantacalcio.it),
  là "dove sta l'affare" (ordinato per margine). Il max bid è calcolato solo per le
  righe di QUESTA pagina, vedi PlayerSearchService#phasePlayers.

  Il fragment "phaseTable" porta con sé hx-get/hx-trigger (non solo il div segnaposto
  in index.html): uno swap "outerHTML" sostituisce l'intero elemento, attributi
  compresi, quindi se questi hx-* mancassero qui il primo refresh dopo un acquisto
  lascerebbe la tabella senza più alcun ascolto — buona per un solo giro, sorda a
  quelli successivi. Quell'hx-get porta l'offset della pagina MOSTRATA, non zero:
  così un acquisto ricarica la pagina che si sta guardando invece di riportare alla
  prima. Se nel frattempo quella pagina è finita oltre la fine (gli ultimi giocatori
  del ruolo sono stati venduti), phasePlayers riporta all'ultima pagina piena.
*/-->
<th:block xmlns:th="http://www.thymeleaf.org">

<div id="phaseTable" th:fragment="phaseTable"
     th:hx-get="@{/legacy/fragments/phase-players(offset=${phasePage.offset})}"
     hx-trigger="fantaStateChanged from:body" hx-swap="outerHTML">
  <h3>GIOCATORI FASE <span th:text="${phase}">D</span>
    <span class="dim">— per quotazione Fantacalcio.it</span>
    <span class="dim phase-count" th:if="${phasePage.total > 0}"
          th:text="${phasePage.total} + ' disponibili'">312 disponibili</span></h3>
  <!--/* L'ultimo giocatore del ruolo può essere venduto proprio durante questa fase
       (es. dalla barra comando, mentre la tabella è aperta): senza questo ramo la
       tabella si ricaricherebbe su un'intestazione con sotto zero righe, un vuoto
       muto che sembra un errore di caricamento. */-->
  <p class="empty-role" th:if="${phasePage.rows.isEmpty()}">nessun giocatore disponibile in questo ruolo</p>
  <div class="table-scroll" th:unless="${phasePage.rows.isEmpty()}">
    <table>
      <thead>
        <tr>
          <th>Nome</th><th>Squadra</th><th>Valore</th><th>Max bid</th>
          <th>Fantamedia attesa</th><th>Titolarità</th><th></th>
        </tr>
      </thead>
      <tbody id="phaseRows">
        <th:block th:replace="~{::phaseRowsBody}"></th:block>
      </tbody>
    </table>
  </div>

  <!--/*
    Navigazione fra le pagine. I bottoni sostituiscono l'intero #phaseTable, quindi
    tornano con i propri offset gia' aggiornati. Sono disabilitati agli estremi invece
    di sparire: una barra che perde un bottone sposta l'altro sotto il puntatore, e in
    asta si clicca senza guardare.
  */-->
  <div class="phase-nav" th:unless="${phasePage.rows.isEmpty()}">
    <button type="button" th:disabled="${!phasePage.hasPrevious()}"
            th:hx-get="@{/legacy/fragments/phase-players(offset=${phasePage.previousOffset()})}"
            hx-target="#phaseTable" hx-swap="outerHTML">← precedenti</button>
    <span class="dim">pagina <b th:text="${phasePage.pageNumber()}">1</b>
      di <span th:text="${phasePage.pageCount()}">13</span></span>
    <button type="button" th:disabled="${!phasePage.hasNext()}"
            th:hx-get="@{/legacy/fragments/phase-players(offset=${phasePage.nextOffset()})}"
            hx-target="#phaseTable" hx-swap="outerHTML">successivi →</button>
  </div>
</div>

<th:block th:fragment="phaseRowsBody">
  <tr th:each="r : ${phasePage.rows}">
    <td th:text="${r.player.name}">Bastoni</td>
    <td th:text="${r.player.team}">Inter</td>
    <td th:text="${r.player.listPrice}">12</td>
    <td th:text="${r.recommendation.maxBid}">18</td>
    <td th:text="${#numbers.formatDecimal(r.fantamediaAttesa(), 1, 2)}">6,20</td>
    <td th:text="${#numbers.formatDecimal(r.titolaritaPercent(), 1, 0)} + '%'">82%</td>
    <td>
      <!--/* Due modi, due situazioni diverse: "batti" quando il giocatore va all'asta e
           il prezzo lo decidera' la stanza; il form qui accanto quando il prezzo e'
           gia' noto e resta solo da registrarlo. Entrambi finiscono su /legacy/assign. */-->
      <button type="button" class="bidder-open bidder-open-row" title="batti l'asta"
              th:hx-get="@{/legacy/asta/battitore(playerId=${r.player.id})}"
              hx-target="#bidderMount" hx-swap="innerHTML">⏱ batti</button>
      <!--/* Stesso /legacy/assign dell'articolo di analisi: identica validazione, identici
           messaggi di rifiuto in italiano — nessuna seconda via per registrare un
           acquisto. */-->
      <form class="assign-row" hx-post="/legacy/assign" hx-target="#main" hx-swap="outerHTML">
        <input type="hidden" name="playerId" th:value="${r.player.id}">
        <input type="number" name="price" min="1" class="assign-price"
               th:value="${r.recommendation.maxBid}">
        <select name="participantId">
          <option th:each="pt : ${participants}" th:value="${pt.id}" th:text="${pt.name}"
                  th:selected="${pt.me}">Nome</option>
        </select>
        <button type="submit">assegna</button>
      </form>
    </td>
  </tr>
</th:block>

</th:block>
