<!--
  File separato apposta, sullo stesso schema di fragments/update.html: qui vivono i
  due fragment della tabella di fase, "phaseTable" (l'intero pannello, per il primo
  caricamento o un cambio fase) e "phaseRowsBody" (solo le righe, per "carica altri
  25" — sostituisce la sola riga del bottone, non l'intera tabella).

  Risponde a una domanda diversa dal pannello TARGET: qui "qual è il migliore
  disponibile in questo ruolo" (ordinato per punti attesi), là "dove sta l'affare"
  (ordinato per margine). Il max bid è calcolato solo per le righe di QUESTA pagina,
  vedi PlayerSearchService#phasePlayers.
-->
<th:block xmlns:th="http://www.thymeleaf.org">

<div id="phaseTable" th:fragment="phaseTable">
  <h3>GIOCATORI FASE <span th:text="${phase}">D</span>
    <span class="dim">— il migliore disponibile, per punti attesi</span></h3>
  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th>Nome</th><th>Squadra</th><th>Valore</th><th>Max bid</th>
          <th>Fantamedia attesa</th><th>Titolarità</th><th></th>
        </tr>
      </thead>
      <tbody id="phaseRows">
        <th:block th:replace="~{::phaseRowsBody}"></th:block>
      </tbody>
    </table>
  </div>
</div>

<th:block th:fragment="phaseRowsBody">
  <tr th:each="r : ${phasePage.rows}">
    <td th:text="${r.player.name}">Bastoni</td>
    <td th:text="${r.player.team}">Inter</td>
    <td th:text="${r.player.listPrice}">12</td>
    <td th:text="${r.recommendation.maxBid}">18</td>
    <td th:text="${#numbers.formatDecimal(r.fantamediaAttesa(), 1, 2)}">6,20</td>
    <td th:text="${#numbers.formatDecimal(r.titolaritaPercent(), 1, 0)} + '%'">82%</td>
    <td>
      <!-- Stesso /assign dell'articolo di analisi: identica validazione, identici
           messaggi di rifiuto in italiano — nessuna seconda via per registrare un
           acquisto. -->
      <form class="assign-row" hx-post="/assign" hx-target="#main" hx-swap="outerHTML">
        <input type="hidden" name="playerId" th:value="${r.player.id}">
        <input type="number" name="price" min="1" class="assign-price"
               th:value="${r.recommendation.maxBid}">
        <select name="participantId">
          <option th:each="pt : ${participants}" th:value="${pt.id}" th:text="${pt.name}"
                  th:selected="${pt.me}">Nome</option>
        </select>
        <button type="submit">assegna</button>
      </form>
    </td>
  </tr>
  <tr th:if="${phasePage.hasMore}">
    <td colspan="7">
      <button type="button" class="load-more"
              th:hx-get="@{/fragments/phase-players(offset=${phasePage.nextOffset})}"
              hx-target="closest tr" hx-swap="outerHTML">carica altri 25</button>
    </td>
  </tr>
</th:block>

</th:block>
