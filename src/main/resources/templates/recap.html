<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Riepilogo asta</title>
  <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<div class="wrap">

  <!--/*
    Solo indietro ed esporta. La schermata d'asta e' l'unica da cui si raggiunge ogni
    altra pagina: da qui si torna li', e da li' si sceglie. Una navigazione completa
    ripetuta su ogni pagina moltiplica i modi di perdersi senza aggiungere una sola
    destinazione.
  */-->
  <div class="nav">
    <a th:href="@{/legacy/asta}">← indietro all'asta</a>
    <!--/* Stesso endpoint del bottone sulla pagina proiettata. */-->
    <a th:href="@{/legacy/battitore/esporta}">↓ esporta rose</a>
  </div>

  <h1>Riepilogo</h1>

  <p class="banner" th:if="${message}" th:text="${message}"></p>

  <div class="recap-board">
    <section class="recap-col" th:each="col : ${columns}" th:classappend="${col.me} ? 'me' : ''">
      <h2 th:text="${col.participantName}">Marco</h2>
      <div class="meta">
        <span th:text="${col.budgetRemaining} + ' crediti'">289 crediti</span> ·
        <span th:text="${col.slotsRemaining} + ' slot'">21 slot</span>
      </div>

      <div th:each="role : ${roles}">
        <div class="recap-role" th:text="${role}">P</div>
        <div class="recap-player" th:each="p : ${col.byRole.get(role)}"
               th:classappend="${p.filled()} ? '' : 'is-empty'">
          <span class="recap-name" th:text="${p.filled()} ? ${p.name} : '—'">Bastoni</span>
          <span class="price" th:text="${p.filled()} ? ${p.price} : ''">47</span>
          <!--/* Due click, decisi con l'utente: il primo trasforma il bottone in
               "conferma?", il secondo rimuove davvero. Il comportamento vive in
               recap.js: qui il bottone è type="button", non type="submit", quindi
               senza JavaScript (script non caricato, errore prima dell'attach del
               listener) il bottone non fa nulla — un click, sbagliato o no, non
               invia mai il form da solo. È recap.js che promuove il bottone a
               type="submit" solo dopo la conferma, non prima: se lo script manca,
               il fallimento è "il bottone non risponde", mai "un click rimuove
               l'acquisto in silenzio". */-->
          <form method="post" th:action="@{/legacy/riepilogo/revoca}" th:if="${p.filled()}">
            <input type="hidden" name="targetSeq" th:value="${p.seq}">
            <button type="button" class="revoke-btn" title="rimuovi">✕</button>
          </form>
        </div>
      </div>
    </section>
  </div>

</div>
<script th:src="@{/recap.js}"></script>
</body>
</html>
